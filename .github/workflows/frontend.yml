name: Frontend

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Regenerate OpenAPI and TypeScript types
        run: |
          uv run --no-sync python -m project.presentation.bff.openapi > frontend/openapi.json
          npm run gen:api --prefix frontend

      - name: Check the generated contract is committed
        run: git diff --exit-code frontend/openapi.json frontend/src/api/schema.d.ts

      - name: Generate the locale messages
        run: npm run i18n --prefix frontend

      - name: Type-check
        run: npm run typecheck --prefix frontend

      - name: Unit tests
        run: npm test --prefix frontend

      - name: Build
        run: npm run build --prefix frontend
