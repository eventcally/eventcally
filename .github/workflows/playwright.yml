      - name: Wait for server
        run: |
          until curl --silent --fail --output /dev/null http://127.0.0.1:5001; do
            sleep 1
          done
        timeout-minutes: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright run
        # blob is the only reporter whose output can be merged across shards;
        # github keeps the inline annotations on the diff.
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob,github
        # The fixtures now start .scripts/e2e_fixture_server.py, which boots the
        # app in this step rather than inheriting an already-running one, so this
        # needs the same environment as "Start server" above.
        env:
          BASE_URL: http://127.0.0.1:5001
          DATABASE_URL: postgresql://postgres:postgres@localhost/eventcally_tests
          TESTING: 1
          AUTHLIB_INSECURE_TRANSPORT: 1
