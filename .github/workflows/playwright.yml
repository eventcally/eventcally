          JWT_PUBLIC_JWKS: '{"keys":[{"kid":"default","kty":"RSA","use":"sig","alg":"RS256","n":"xMl-DFiwhnoWRiVPcEIstAW66VY39JNo1TG1U10OfaFMuWI8jcq5VfSRPBdXLRqAJwZi4CZCwOglEvURArf1QTxVBdLpDW75tD6fNOHaHKvX5WPRMGC_7Rfo9K_OgEWnQplc_0Me9D8MzTpIA56Uo_H_DE82kGWOMcWdqIA40pHaCZ7iWIoD7pS6DcRDt_8o0-IQqhMC4SrjL2HelzXHpg4glgY-GLbvTPOfV_OlFCAWDK3oN3wMBYS-TFP2Q_5pXfPCajIrSfF7dHyZU2d_K26A8naKcSUYuJzA8GBXkPx8YObtOS5SYYeD5GeGsX3IsVVyk3WqMVN7NXvRqmNjqQ","e":"AQAB"}]}'

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # One sticky comment for the whole suite. A per-shard comment would either
  # clobber its siblings or report only a third of the results, so the shards are
  # merged here first.
  playwright-comment:
    needs: playwright
    # always(), because a failing run is exactly when the comment matters most.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-22.04

    # Scoped deliberately: the test job runs `pip install`, `npm ci` and a browser
    # with a read-only token, and only this job — which runs no third-party code
    # beyond the pinned action — can write to the pull request.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install node dependencies
        # No `playwright install`: merging reports needs the CLI, not a browser.
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: |
          npx playwright merge-reports --reporter=json ./all-blob-reports
          npx playwright merge-reports --reporter=html ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Comment test results
        # Pinned to a SHA rather than a tag: this action holds a write token.
        # daun/playwright-report-summary v4.1.0
        uses: daun/playwright-report-summary@31ed947ec7a623d18a66cfd20ef546dc66ef8063
        with:
          report-file: report.json
          report-tag: playwright
          comment-title: "Playwright results"
          test-command: npx playwright test
          job-summary: "true"
          footer: |
            The merged HTML report is in the
            [run artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
