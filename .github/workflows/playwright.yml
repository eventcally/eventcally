name: Playwright

# Controls when the action will run.
on: [pull_request, workflow_dispatch]

# This workflow never uses GITHUB_TOKEN; checkout only needs to read the repo.
# The repository default is currently `write`, so without this the job would hand
# a write-capable token to everything `pip install` and `npm ci` pull in.
permissions:
  contents: read

env:
  LANG: "de_DE.UTF-8"

jobs:
  playwright:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Containers must run in Linux based operating systems
    runs-on: ubuntu-22.04

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: mdillon/postgis
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventcally_tests
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start server
        run: |
          flask test create-all
          flask test seed
          gunicorn -b 127.0.0.1:5001 -w 1 main:app --daemon
