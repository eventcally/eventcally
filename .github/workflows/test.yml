# This is a basic workflow to help you get started with Actions

name: Tests

# Controls when the action will run.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      store_durations:
        description: Record test durations (uploads the merged .test_durations as the test-durations artifact)
        type: boolean
        default: false

# Jobs that need more (build-image pushes to GHCR, integration-tests pulls from it)
# declare their own block; coverage only reads artifacts and writes the step summary.
permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Empty when this run cannot push (a pull_request from a fork gets a
      # read-only GITHUB_TOKEN) -- integration-tests then falls back to the
      # plain host-Python path instead of a job container.
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Determine whether this run can push to GHCR
        id: trust
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.trust.outputs.trusted == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        if: steps.trust.outputs.trusted == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/test:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: set-image
        run: |
          if [ "${{ steps.trust.outputs.trusted }}" = "true" ]; then
            echo "image=ghcr.io/${{ github.repository }}/test:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

  # Fast lane: no services, no image build. Runs in parallel with the PostGIS groups.
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run unit tests
        run: pytest tests/unit --cov=project --cov-context=test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: .coverage
          include-hidden-files: true

  # Label of the container job
  integration-tests:
    needs: build-image
    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Empty when build-image couldn't push (fork PR) -- runs on the bare
    # runner instead, using the fallback steps below.
    container: ${{ needs.build-image.outputs.image }}
    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image -- production parity, same image as docker-compose.test.yml
        image: postgis/postgis:12-3.1
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Admin database: the runner creates eventcally_tests_<group> from it and refuses an
          # admin database whose name starts with eventcally_tests.
          POSTGRES_DB: eventcally
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

      redis:
        # Docker Hub image -- pinned to the production Redis line (6.2); moves with production in the
        # Redis upgrade track. Dependabot does not bump workflow service images.
        image: redis:6.2
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379:6379

      limiter_redis:
        # Docker Hub image -- pinned to the production Redis line (6.2); moves with production in the
        # Redis upgrade track. Dependabot does not bump workflow service images.
        image: redis:6.2
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6380:6379

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # Fallback path only -- inside the build-image container, the
      # interpreter and dependencies are already baked in.
      - name: Set up uv
        if: needs.build-image.outputs.image == ''
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        if: needs.build-image.outputs.image == ''
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Service containers can't take a `command`, so loosen durability here. Test databases
      # are throwaway; all three settings are reloadable (same as docker-compose.test.yml).
      - name: Tune Postgres for tests
        run: |
          python - <<'PY'
          import os

          import psycopg2

          conn = psycopg2.connect(os.environ["TEST_DB_ADMIN_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute("ALTER SYSTEM SET fsync = off")
              cur.execute("ALTER SYSTEM SET synchronous_commit = off")
              cur.execute("ALTER SYSTEM SET full_page_writes = off")
              cur.execute("SELECT pg_reload_conf()")
          PY
        env:
          TEST_DB_ADMIN_URL: ${{ needs.build-image.outputs.image != '' && 'postgresql://postgres:postgres@postgres/eventcally' || 'postgresql://postgres:postgres@localhost/eventcally' }}

      # 4 shards x 4 pytest-split groups = 16 groups; each shard runs its 4 groups in parallel.
      - name: Run tests
        run: >-
          .scripts/run_tests.sh --shard ${{ matrix.shard }} --shards 4 --splits 4 --no-report
          ${{ inputs.store_durations && '--store-durations' || '' }}
          -- tests/integration
        env:
          # Inside the job container, services resolve by service name, not
          # localhost; limiter_redis is always reached on its container port
          # 6379, not the 6380 published for host-side access.
          TEST_DB_ADMIN_URL: ${{ needs.build-image.outputs.image != '' && 'postgresql://postgres:postgres@postgres/eventcally' || 'postgresql://postgres:postgres@localhost/eventcally' }}
          TEST_DB_HOST: ${{ needs.build-image.outputs.image != '' && 'postgres' || 'localhost' }}
          TEST_DB_CREDENTIALS: postgres:postgres
          TEST_REDIS_HOST: ${{ needs.build-image.outputs.image != '' && 'redis' || 'localhost' }}
          TEST_LIMITER_REDIS_HOST: ${{ needs.build-image.outputs.image != '' && 'limiter_redis' || 'localhost' }}
          TEST_LIMITER_REDIS_PORT: ${{ needs.build-image.outputs.image != '' && '6379' || '6380' }}
          # The CI Redis services have no password.
          TEST_REDIS_CREDENTIALS: ""

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true

      - name: Upload durations
        if: ${{ inputs.store_durations }}
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-${{ matrix.shard }}
          path: .test_durations
          include-hidden-files: true

  coverage:
    needs: [unit-tests, integration-tests]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked --only-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download all artifacts
        # Downloads coverage-unit, coverage1, coverage2, etc. Scoped by pattern because
        # build-image's docker/build-push-action also uploads a Docker Build
        # Cloud summary artifact (*.dockerbuild) to the same run, which an
        # unscoped download tries to fetch too and fails to extract.
        uses: actions/download-artifact@v8
        with:
          pattern: coverage*

      - name: Combine coverage files
        run: coverage combine coverage*/.coverage*

      - name: Coverage report
        run: |
          coverage report --precision=2 --fail-under=100
          coverage report --precision=2 --skip-covered --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # Per-slice ownership (.scripts/test_slices.py): fails only for slices in ENFORCED.
      - name: Slice coverage
        run: |
          python .scripts/test_slices.py check --data .coverage --markdown >> "$GITHUB_STEP_SUMMARY"
          python .scripts/test_slices.py check --data .coverage

      # Only when recorded (workflow_dispatch with store_durations). Download the result and
      # commit it as .test_durations; CI never pushes.
      - name: Download durations
        if: ${{ inputs.store_durations }}
        uses: actions/download-artifact@v8
        with:
          pattern: test-durations-*
          path: durations

      - name: Merge durations
        if: ${{ inputs.store_durations }}
        run: |
          python - <<'PY'
          import glob
          import json

          durations = {}
          for path in sorted(glob.glob("durations/*/.test_durations")):
              with open(path) as f:
                  durations.update(json.load(f))

          with open(".test_durations", "w") as f:
              json.dump(durations, f, sort_keys=True, indent=4)
              f.write("\n")
          PY

      - name: Upload merged durations
        if: ${{ inputs.store_durations }}
        uses: actions/upload-artifact@v7
        with:
          name: test-durations
          path: .test_durations
          include-hidden-files: true
