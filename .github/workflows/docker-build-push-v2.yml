name: Docker build and push V2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow default, so contents: read is repeated.
    permissions:
      contents: read       # build from this repo's Git context
      id-token: write      # actions/attest: OIDC token for the Sigstore signing certificate
      attestations: write  # actions/attest: store the attestation for `gh attestation verify`
    steps:
      -
        name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: eventcally/eventcally
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      -
        name: Extract tag names
        id: tag_names
        run: |
          names=$(echo "${{ steps.docker_meta.outputs.tags }}" | sed 's/.*://' | paste -sd, -)
          echo "names=$names" >> "$GITHUB_OUTPUT"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          # Docker Hub personal access token (Read & Write)
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          annotations: ${{ steps.docker_meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          build-args: |
            APP_TAGS=${{ steps.tag_names.outputs.names }}
      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      -
        name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: docker.io/eventcally/eventcally
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
