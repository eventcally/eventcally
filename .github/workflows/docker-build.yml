name: Docker build

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: false
