# Version updates. Several versions are pinned in lockstep in places Dependabot cannot
# update (setup-node `node-version`, setup-uv `version`, lint.yml tool inputs, the uv
# `COPY --from` tag, .pre-commit-config.yaml); those are ignored here and bumped by hand.
# The pre-commit ecosystem is left out on purpose: every hook rev is such a lockstep pin.
# Version updates are minor and patch only (majors are done by hand), except for
# GitHub Actions, whose majors come grouped with the rest.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    labels: [dependencies, github-actions]
    groups:
      # All update types, majors included, in one PR.
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /                 # Dockerfile and Dockerfile.e2e
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
      exclude: ["node"]          # Node patch images are security releases
    labels: [dependencies, docker]
    ignore:
      # requires-python ==3.12.*, .python-version, setup-uv python-version: a Python
      # bump is a deliberate multi-file change.
      - dependency-name: python
        versions: [">= 3.13"]
      # Must equal @playwright/test in package.json; bumped with the npm PR.
      # Dependabot names the image "playwright", without the registry.
      - dependency-name: "*playwright"
      # Major updates are bumped by hand (security updates still come).
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /                 # docker-compose.yml, .debug.yml, .test.yml
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
      exclude: ["node"]
    labels: [dependencies, docker]
    ignore:
      # PostgreSQL major = data migration; also pinned in test.yml and deployment/.
      - dependency-name: postgis/postgis
      # Major updates are bumped by hand (security updates still come).
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      docker-compose-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /                 # pyproject.toml + uv.lock
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    labels: [dependencies, python]
    ignore:
      # jsonschema 3.2.0 / swagger-spec-validator import pkg_resources, apispec 4 and
      # webargs 7 import distutils (see pyproject.toml). Bumped by hand until those are
      # upgraded; a name-level ignore also blocks its security updates.
      - dependency-name: setuptools
      # Must match lint.yml inputs and .pre-commit-config.yaml; bumped by hand.
      # A name-level ignore also blocks security updates, so their security fixes
      # are manual too: check the alerts for these yourself.
      - dependency-name: black
      - dependency-name: isort
      - dependency-name: flake8
      - dependency-name: import-linter
      # Need code changes: 5.9 drops flask_security.forms.get_form_field_label,
      # 2.1 defaults postgresql:// to the psycopg 3 driver.
      - dependency-name: flask-security-too
        versions: [">= 5.9"]
      - dependency-name: sqlalchemy
        versions: [">= 2.1"]
      # Major updates are bumped by hand (security updates still come).
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      python-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    ignore:
      # Major updates are bumped by hand (security updates still come).
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /                 # @playwright/test only
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    labels: [dependencies, javascript]
    ignore:
      # Major updates are bumped by hand (security updates still come).
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      playwright:
        patterns: ["*"]
