    <script>
      function render_event_status_pill(event) {
        if (event.eventStatus != null) {
            if (event.eventStatus == "EventCancelled") {
                return '<span class="badge badge-pill badge-warning">Abgesagt</span>';
            }
            if (event.eventStatus == "EventMovedOnline") {
                return '<span class="badge badge-pill badge-warning">Online verschoben</span>';
            }
            if (event.eventStatus == "EventPostponed") {
                return '<span class="badge badge-pill badge-warning">Verschoben</span>';
            }
            if (event.eventStatus == "EventRescheduled") {
                return '<span class="badge badge-pill badge-warning">Neu angesetzt</span>';
            }
        }

        if (event.status != null) {
            if (event.status == "cancelled") {
                return '<span class="badge badge-pill badge-warning">Abgesagt</span>';
            }
            if (event.status == "movedOnline") {
                return '<span class="badge badge-pill badge-warning">Online verschoben</span>';
            }
            if (event.eventStatus == "postponed") {
                return '<span class="badge badge-pill badge-warning">Verschoben</span>';
            }
            if (event.eventStatus == "rescheduled") {
                return '<span class="badge badge-pill badge-warning">Neu angesetzt</span>';
            }
        }

        return '';
    }

    function render_attendance_mode_pill(event) {
        if (event.attendance_mode != null) {
            if (event.attendance_mode == "online") {
                return '<span class="badge badge-pill badge-info">Online</span>';
            }
            if (event.attendance_mode == "mixed") {
                return '<span class="badge badge-pill badge-info">Präsenzveranstaltung und online</span>';
            }
        }

        return '';
    }

    function render_booked_up_pill(event) {
      if (event.booked_up) {
        return '<span class="badge badge-pill badge-warning">Ausgebucht</span>';
      }

      return '';
    }

    function render_event_warning_pills(event) {
      return render_event_status_pill(event) + ' ' + render_booked_up_pill(event) + ' ' + render_attendance_mode_pill(event);
    }

    </script>

<script>
  jQuery.validator.addMethod("dateRange", function(value, element, params) {
    var start_id = params[0];
    var end_id = params[1];

    var start_val = $(start_id).val();
    var end_val = $(end_id).val();

    if (start_val == '' || end_val == '') {
      return true;
    }

    var start = get_moment_with_time(start_id);
    var end = get_moment_with_time(end_id);
    return end >= start;
  }, jQuery.validator.format("Der Start muss vor dem Ende sein."));

  jQuery.validator.addMethod("dateRangeDay", function(value, element, params) {
    var start_id = params[0];
    var end_id = params[1];

    var start_val = $(start_id).val();
    var end_val = $(end_id).val();

    if (start_val == '' || end_val == '') {
      return true;
    }

    var start = get_moment_with_time(start_id);
    var end = get_moment_with_time(end_id);
    var max = start.add(14, 'day');
    return end <= max;
  }, jQuery.validator.format("Eine Veranstaltung darf maximal 180 Tage dauern."));

  $.validator.addMethod( "time", function( value, element ) {
    return this.optional( element ) || /^([01]\d|2[0-3]|[0-9])(:[0-5]\d){1,2}$/.test( value );
  }, jQuery.validator.format("Bitte gib eine gültige Uhrzeit zwischen 00:00 und 23:59 ein."));

  jQuery.validator.setDefaults({
    errorElement: 'div',
    errorClass: 'invalid-feedback',
    errorPlacement: function (error, element) {
        element.closest('.input-group').after(error);
    },
    highlight: function (element, errorClass, validClass) {
        $(element).closest('.input-group').find(':input').removeClass('is-valid').addClass('is-invalid');
    },
    unhighlight: function (element, errorClass, validClass) {
        $(element).closest('.input-group').find(':input').removeClass('is-invalid').addClass('is-valid');
    },
    onclick: function (element, event) {
      return true;
    }
  });

  function createSelect2Tag(params) {
    var term = $.trim(params.term);

      if (term === '') {
        return null;
      }

      return {
        id: term,
        tag_text: "Verwende einfach %(term)s".replace("%(term)s", '"' + term + '"'),
        term: term,
        text: term,
        is_new_tag: true
      }
  }

  function insertSelect2Tag(data, tag) {
    data.push(tag);
  }

  function select2TemplateResult(state) {
    if ("is_new_tag" in state) {
        return $("<strong>" + state.tag_text + "</strong>");
      }
      return state.text;
  }

  function select2GetData(e) {
    var dataArray = $(e.target).select2('data');
    var data = {};

    if (dataArray.length > 0) {
      data = dataArray[0];
    }

    return data;
  }

</script>
