[project]
name = "eventcally"
version = "0.0.0"
description = "Event calendar platform (Flask + SQLAlchemy, DDD)"
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.10.3",
    "apispec>=6.10.0,<7",
    "argon2-cffi>=23.1.0",
    "Authlib>=1.9.1",
    "Babel>=2.12.1",
    "bcrypt>=4.0.1",
    "beautifulsoup4>=4.12.2",
    "celery>=5.4.0",
    "click>=8.1.3",
    "colour>=0.1.5",
    "cryptography>=42.0.4",
    "dependency-injector>=4.48.2",
    "email_validator>=2.2.0",
    "Flask>=3.0.3",
    "Flask-Admin>=2.2.1",
    "flask-apispec>=0.11.4",
    "flask-babel>=4.0.0",
    "Flask-Cors>=6.0.0",
    "Flask-Dance>=6.2.0",
    "Flask-gzip>=0.2",
    "Flask-Limiter>=3.12",
    "Flask-Login>=0.6.3",
    "Flask-Mail>=0.9.1",
    "flask-marshmallow>=0.15.0",
    "Flask-Migrate>=4.0.4",
    "Flask-QRcode>=3.1.0",
    "Flask-RESTful>=0.3.9",
    "Flask-Security-Too>=5.5.2,<5.9",  # 5.9 drops forms.get_form_field_label
    "Flask-SQLAlchemy>=3.0.3",
    "Flask-WTF>=1.2.1",
    "GeoAlchemy2>=0.13.1",
    "googlemaps>=4.10.0",
    "gunicorn>=22.0.0",
    "icalendar>=5.0.11",
    "Jinja2>=3.1.6",
    "MarkupSafe>=2.1.2",
    "marshmallow>=3.19.0",
    "marshmallow-enum>=1.5.1",
    "marshmallow-sqlalchemy>=0.29.0",
    "pillow>=10.4.0",
    "psycopg2-binary>=2.9.6",
    "pydantic>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=0.15.0",
    "PyYAML>=6.0.1",
    "recurring-ical-events>=2.1.0",
    "redis>=4.5.4",
    "requests>=2.33.0",
    "requests-oauthlib>=1.3.0",
    "SQLAlchemy>=2.0.9,<2.1",  # 2.1 fails to start: "No module named psycopg"
    "SQLAlchemy-Utils>=0.41.0",
    "typing_extensions>=4.14.1",
    "Werkzeug>=3.0.3",
    "WTForms>=3.0.1",
    "WTForms-SQLAlchemy>=0.3",
]

[dependency-groups]
dev = [
    # Exact pins: black/isort/flake8/import-linter must match .pre-commit-config.yaml (lint.yml runs these from uv.lock).
    "pytest==9.1.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.17.0",
    "pytest-split==0.11.0",
    "pytest-datadir==1.8.0",
    "requests-mock==1.12.1",
    "coverage==7.16.2",
    "black==26.10.1",
    "isort==5.12.0",
    "flake8==6.1.0",
    "import-linter==1.12.1",
    "pre-commit==3.8.0",
    "debugpy==1.8.22",
    "swagger-spec-validator==3.0.4",
]

[tool.uv]
# An application, not a library: `uv sync` installs the dependencies only, never the
# project itself, so no [build-system] is needed.
package = false
# Lock only for the platforms we run on (macOS dev, Linux CI/Docker); this keeps the
# resolver from failing on old pins that lack wheels for e.g. Windows.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
