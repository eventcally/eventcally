services:
  db:
    image: postgis/postgis:12-3.1
    healthcheck:
      test: "pg_isready --username=eventcally && psql --username=eventcally --list"
      start_period: "5s"
    stop_grace_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=eventcally
      - POSTGRES_USER=eventcally
      - POSTGRES_PASSWORD=pass

  redis:
    image: bitnami/redis:latest
    healthcheck:
      test: "redis-cli -a 'pass' ping | grep PONG"
      start_period: "5s"
    stop_grace_period: 30s
    volumes:
      - redis_data:/bitnami/redis/data
    environment:
      REDIS_PASSWORD: pass

  limiter_redis:
    image: bitnami/redis:latest
    healthcheck:
      test: "redis-cli -a 'pass' ping | grep PONG"
      start_period: "5s"
    stop_grace_period: 30s
    volumes:
      - limiter_redis_data:/bitnami/redis/data
    environment:
      REDIS_PASSWORD: pass

  mailhog:
    image: mailhog/mailhog
    healthcheck:
      test: "curl -f localhost:8025"
      interval: "60s"
      timeout: "5s"
      start_period: "5s"
    ports:
     - "8026:8025"

  web:
    build: .
    environment:
      <<: *default-web-env
    healthcheck:
      test: "curl -f ${SERVER_NAME}/up"
      interval: "60s"
      timeout: "5s"
      start_period: "5s"
    stop_grace_period: 45s
    ports:
      - "${WEB_HOST_PORT:-5000}:${WEB_HOST_PORT:-5000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      limiter_redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  worker:
    build: .
    environment:
      <<: *default-web-env
    stop_grace_period: 45s
    command: celery -A project.celery worker --loglevel=info
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  scheduler:
    build: .
    environment:
      <<: *default-web-env
    stop_grace_period: 45s
    command: celery -A project.celery beat --loglevel=info
    entrypoint: []
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  flower:
    image: mher/flower:1.2
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://default:pass@redis
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  limiter_redis_data: