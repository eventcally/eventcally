# Docker's embedded DNS. Required because the upstream host below is held in a variable:
# that defers resolution to request time instead of caching whatever /etc/resolv.conf
# returned at startup. A literal `proxy_pass http://web:5000` is resolved exactly once, and
# if that single lookup escapes to public DNS the `.web` gTLD answers 127.0.53.53 -- so the
# upstream stays poisoned for the life of the worker process and every request 502s until
# someone restarts this container by hand. `depends_on: service_healthy` does not cover it:
# that is honoured by `docker compose up`, not by the restart policy after a daemon restart.
#
# 127.0.0.11 is not itself the protection -- it forwards misses to the host's resolvers,
# which is how a bad answer would arrive in the first place. `valid=10s` is the protection:
# it caps how long a bad answer survives. Do not drop it.
#
# No loop guard is needed here (unlike setups where nginx listens on the upstream's port):
# this server listens on 80 and proxies to :5000, so a loopback answer finds nothing
# listening and fails immediately with connection refused instead of self-proxying.
resolver 127.0.0.11 valid=10s ipv6=off;
# Default is 30s. Every request now depends on a DNS round trip, so an unresponsive
# resolver would otherwise stall each request for half a minute and exhaust workers.
resolver_timeout 5s;

# When running behind an outer proxy that terminates TLS (Plesk in production), preserve the
# client's original scheme/IP instead of overwriting them with this inner hop's values.
# Falls back to $scheme/$remote_addr when there is no outer proxy (standalone).
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}
map $http_x_real_ip $client_ip {
    default $remote_addr;
    "~.+"   $http_x_real_ip;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;

    client_max_body_size 20m;

    location ^~ /image/ {
        root /var/www/html/cache/img;
        expires 1h;

        location ~ ^/image/(?<id>[0-9]+)/(?<hash>[0-9]+) {
            if ($arg_s = '') { rewrite (.*) $1?s=500 last; }
            try_files /${id}-${hash}-${arg_s}-${arg_s}.png /${id}-${hash}-${arg_s}-${arg_s}.jpg @docker;
        }
        location ~ ^/image/(?<id>[0-9]+) {
            if ($arg_s = '') { rewrite (.*) $1?s=500 last; }
            try_files /${id}-${arg_s}-${arg_s}.png /${id}-${arg_s}-${arg_s}.jpg @docker;
        }
    }

    location ^~ /static/ {
        root /var/www/html;
        location ~ ^/static/(.*)$ {
            try_files /static/$1 @docker;
        }
    }

    location ^~ /dump/ {
        alias /var/www/html/cache/dump/;
    }
    location = /sitemap.xml {
        alias /var/www/html/cache/sitemap.xml;
    }
    location = /robots.txt {
        alias /var/www/html/cache/robots.txt;
    }
    location = /favicon.ico {
        alias /var/www/html/static/favicon.ico;
        expires 12h;
    }

    location @docker {
        set $upstream web:5000;
        # Reached via `rewrite ... last` from the /image/ blocks above, so the URI must be
        # rebuilt from $uri/$args rather than $request_uri -- the latter is the *original*
        # client URI and would drop the s=500 those rewrites inject.
        proxy_pass http://$upstream$uri$is_args$args;
        proxy_connect_timeout 5s;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location / {
        set $upstream web:5000;
        # $request_uri is required: nginx drops the URI when proxy_pass uses a variable.
        # It is the raw request line, so percent-encoding survives untouched.
        proxy_pass http://$upstream$request_uri;
        proxy_connect_timeout 5s;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}
