# When running behind an outer proxy that terminates TLS (Plesk in production), preserve the
# client's original scheme/IP instead of overwriting them with this inner hop's values.
# Falls back to $scheme/$remote_addr when there is no outer proxy (standalone).
map $http_x_forwarded_proto $client_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
}
map $http_x_real_ip $client_ip {
    default $remote_addr;
    "~.+"   $http_x_real_ip;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;

    client_max_body_size 20m;

    location ^~ /image/ {
        root /var/www/html/cache/img;
        expires 1h;

        location ~ ^/image/(?<id>[0-9]+)/(?<hash>[0-9]+) {
            if ($arg_s = '') { rewrite (.*) $1?s=500 last; }
            try_files /${id}-${hash}-${arg_s}-${arg_s}.png /${id}-${hash}-${arg_s}-${arg_s}.jpg @docker;
        }
        location ~ ^/image/(?<id>[0-9]+) {
            if ($arg_s = '') { rewrite (.*) $1?s=500 last; }
            try_files /${id}-${arg_s}-${arg_s}.png /${id}-${arg_s}-${arg_s}.jpg @docker;
        }
    }

    location ^~ /static/ {
        root /var/www/html;
        location ~ ^/static/(.*)$ {
            try_files /static/$1 @docker;
        }
    }

    location ^~ /dump/ {
        alias /var/www/html/cache/dump/;
    }
    location = /sitemap.xml {
        alias /var/www/html/cache/sitemap.xml;
    }
    location = /robots.txt {
        alias /var/www/html/cache/robots.txt;
    }
    location = /favicon.ico {
        alias /var/www/html/static/favicon.ico;
        expires 12h;
    }

    location @docker {
        proxy_pass http://web:5000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }
}
